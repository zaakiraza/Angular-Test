<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ToDo — Things to do</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the theme before first paint to avoid a flash of the wrong palette.
    // Must match ThemeService (storage key and OS-preference fallback).
    (function () {
      var theme = null;
      try {
        theme = localStorage.getItem('todo-theme');
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = prefersDark ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
